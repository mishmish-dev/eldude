[project]
name = "eldude"
version = "0.0.8"
description = "Grammar checks and language-design prototypes for Eldude"
readme = "README.md"
requires-python = ">=3.14.8"
dependencies = []

[project.scripts]
eldude = "eldude.tooling.cli:main"
eldude-run = "eldude.tooling.run:main"
eldude-format = "eldude.tooling.format:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python-impl/src/eldude"]

[tool.hatch.build.targets.wheel.force-include]
"docs/eldude.ebnf" = "eldude/eldude.ebnf"
"eldude-stdlib" = "eldude/stdlib"

[tool.hatch.build.targets.sdist]
include = ["python-impl", "docs", "eldude-program-examples", "eldude-stdlib", "README.md", "AGENTS.md", "eldude.toml", "eldude.lock", ".python-version", "uv.lock"]
